<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraveHub Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/"><span class="logo">C</span><b>CRAVE<span>HUB</span></b></a><div class="navRight"><span class="adminBadge">ADMIN PANEL</span><a class="ghost" href="/">← Customer Website</a></div></header><main class="adminPage"><div class="sectionHead"><div><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1><p>Manage restaurant operations from one place.</p></div><button class="secondary" onclick="loadAdmin()">↻ Refresh</button></div><div class="dashGrid"><div class="metric"><span>💰</span><small>Total Sales</small><strong id="sales">₹0</strong></div><div class="metric"><span>🧾</span><small>Total Orders</small><strong id="orders">0</strong></div><div class="metric"><span>👥</span><small>Customers</small><strong id="customers">0</strong></div><div class="metric"><span>🎟️</span><small>Active Coupons</small><strong id="coupons">0</strong></div></div><div class="adminPanel"><div class="wide"><h2>Recent Orders</h2><div id="orderTable" class="tableWrap"></div></div><div class="addBox"><h2>Add Menu Item</h2><input id="newName" placeholder="Item name"><select id="newCat"><option>Burgers</option><option>Pizza</option><option>Pasta</option><option>Sides</option><option>Beverages</option><option>Desserts</option></select><input id="newPrice" type="number" placeholder="Price"><input id="newStock" type="number" placeholder="Stock" value="50"><input id="newEmoji" placeholder="Emoji 🍔"><button class="primary full" onclick="addItem()">+ Add Item</button></div></div><div class="adminPanel"><div class="wide"><h2>Customers</h2><div id="customerTable" class="tableWrap"></div></div><div class="addBox"><h2>Create Coupon</h2><input id="cCode" placeholder="Code e.g. FESTIVE25"><input id="cDesc" placeholder="Description"><select id="cType"><option value="PERCENT">Percentage</option><option value="FLAT">Flat Amount</option></select><input id="cValue" type="number" placeholder="Discount value"><input id="cMin" type="number" placeholder="Minimum order"><input id="cMax" type="number" placeholder="Max discount (optional)"><input id="cLimit" type="number" value="100" placeholder="Usage limit"><input id="cExpiry" type="date"><button class="primary full" onclick="addCoupon()">🎟️ Create Coupon</button></div></div><div><h2>Menu Inventory</h2><div id="menuTable" class="tableWrap"></div></div></main><div id="toast" class="toast"></div><script src="/admin.js"></script></body></html>
