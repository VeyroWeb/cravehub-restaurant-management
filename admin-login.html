<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | CraveHub</title><link rel="stylesheet" href="/style.css"></head><body><div class="loginPage"><div class="loginCard"><a class="brand" href="/"><span class="logo">C</span><b>CRAVE<span>HUB</span></b></a><h1>Admin Portal ⚙️</h1><p>Restaurant management control center.</p><form onsubmit="loginAdmin(event)"><input id="username" value="admin" placeholder="Username"><input id="password" type="password" value="admin123" placeholder="Password"><button class="primary full">Login to Dashboard →</button></form><a href="/" class="backLink">← Back to restaurant</a></div></div><script>async function loginAdmin(e){e.preventDefault();try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('admin',JSON.stringify(d.admin));location.href='/admin.html'}catch(e){alert(e.message)}}</script></body></html>
